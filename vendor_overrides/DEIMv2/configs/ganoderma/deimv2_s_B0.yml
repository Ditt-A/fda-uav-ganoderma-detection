__include__:
- ../dataset/ganoderma_B0.yml
- ../runtime.yml
- ../base/optimizer.yml
- ../base/deimv2_benchmark_clean.yml
output_dir: /home/nafisnaufal1426/adit/gemastik/ganoderma_uav_research_starter/runs/benchmark/B0_deimv2s
DEIM:
  backbone: DINOv3STAs
DINOv3STAs:
  name: vit_tiny
  embed_dim: 192
  weights_path: ./ckpts/vitt_distill.pt
  interaction_indexes:
  - 3
  - 7
  - 11
  num_heads: 3
HybridEncoder:
  in_channels:
  - 192
  - 192
  - 192
  depth_mult: 0.67
  expansion: 0.34
  hidden_dim: 192
  dim_feedforward: 512
DEIMTransformer:
  feat_channels:
  - 192
  - 192
  - 192
  hidden_dim: 192
  dim_feedforward: 512
  num_layers: 4
  eval_idx: -1
optimizer:
  type: AdamW
  params:
  - params: ^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$
    lr: 2.5e-05
  - params: ^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$
    lr: 2.5e-05
    weight_decay: 0.0
  - params: ^(?=.*(?:sta|encoder|decoder))(?=.*(?:norm|bn|bias)).*$
    weight_decay: 0.0
  lr: 0.0005
  betas:
  - 0.9
  - 0.999
  weight_decay: 0.0001
epoches: 100
flat_epoch: 50
no_aug_epoch: 0
DEIMCriterion:
  matcher:
    change_matcher: true
    iou_order_alpha: 4.0
    matcher_change_epoch: 101
eval_spatial_size:
- 640
- 640
print_freq: 10
checkpoint_freq: 1
